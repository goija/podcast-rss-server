<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast RSS Reader - Rust Backend</title>
    <style>
        /* CSS Variabelen voor lichte en donkere modus */
        :root {
            --bg-color: #f3f4f6;
            --text-color: #111827;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
            --accent-color: #2563eb;
            --button-bg: #e5e7eb;
            --button-hover: #d1d5db;
        }

        body.dark-mode {
            --bg-color: #111827;
            --text-color: #f9fafb;
            --border-color: #374151;
            --card-bg: #1f2937;
            --accent-color: #60a5fa;
            --button-bg: #374151;
            --button-hover: #4b5563;
        }

        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px; 
            margin: 0 auto; 
            padding: 2rem 1rem; 
            line-height: 1.6; 
            transition: background-color 0.3s, color 0.3s;
        }

        /* Interface Header */
        header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.8rem; }

        .controls {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            background-color: var(--button-bg);
            color: var(--text-color);
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--button-hover); }

        /* Aflevering Kaarten */
        .episode { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            border-radius: 12px; 
            padding: 1.5rem; 
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .episode h2 { 
            margin: 0 0 0.5rem 0; 
            font-size: 1.25rem; 
            color: var(--accent-color); 
        }

        .episode small { 
            display: block; 
            color: #6b7280; 
            margin-bottom: 1rem; 
            font-weight: 500; 
        }

        .episode p { 
            margin: 0 0 1.5rem 0; 
            font-size: 0.95rem; 
        }

        audio { 
            width: 100%; 
            outline: none; 
            border-radius: 8px;
        }

        #status { font-weight: bold; margin-bottom: 1rem; }
        .error { color: #dc2626; }
        .no-results { text-align: center; color: #6b7280; font-style: italic; margin-top: 2rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Podcast Feed</h1>
            <button id="themeToggle">🌙 Donker</button>
        </div>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Zoek op titel of beschrijving...">
        </div>
    </header>

    <div id="status">Bezig met laden van afleveringen...</div>
    <div id="feed"></div>

    <script>
        const backendUrl = '/api/feed';
        const statusDiv = document.getElementById('status');
        const feedDiv = document.getElementById('feed');
        const searchInput = document.getElementById('searchInput');
        const themeToggle = document.getElementById('themeToggle');
        
        let allEpisodes = []; // We slaan de afleveringen hier in op voor de zoekfunctie

        // --- THEMA SCHAKELAAR ---
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeToggle.textContent = '☀️ Licht';
            } else {
                themeToggle.textContent = '🌙 Donker';
            }
        });

        // --- ZOEKFUNCTIE ---
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredEpisodes = allEpisodes.filter(ep => 
                ep.title.toLowerCase().includes(searchTerm) || 
                ep.description.toLowerCase().includes(searchTerm)
            );
            renderEpisodes(filteredEpisodes);
        });

        // --- FEED OPHALEN EN PARSEN ---
        fetch(backendUrl)
            .then(response => {
                if (!response.ok) throw new Error(`Netwerkfout: ${response.status}`);
                return response.text(); 
            })
            .then(xmlString => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
                
                if (xmlDoc.querySelector('parsererror')) throw new Error('Fout bij parsen XML.');

                const items = xmlDoc.querySelectorAll('item');

                // Bouw een array van JavaScript objecten
                items.forEach(item => {
                    const title = item.querySelector('title')?.textContent || 'Geen titel';
                    let description = item.querySelector('description')?.textContent || '';
                    description = description.replace(/(<([^>]+)>)/gi, "").substring(0, 300) + '...';

                    const pubDateRaw = item.querySelector('pubDate')?.textContent;
                    const pubDate = pubDateRaw ? new Date(pubDateRaw).toLocaleDateString('nl-NL', { year: 'numeric', month: 'long', day: 'numeric' }) : 'Onbekend';
                    
                    const enclosure = item.querySelector('enclosure');
                    const audioUrl = enclosure ? enclosure.getAttribute('url') : '';

                    allEpisodes.push({ title, description, pubDate, audioUrl });
                });

                statusDiv.style.display = 'none';
                renderEpisodes(allEpisodes); // Toon alles bij de eerste keer laden
            })
            .catch(error => {
                statusDiv.textContent = `Kan de feed niet laden: ${error.message}`;
                statusDiv.className = 'error';
                console.error(error);
            });

        // --- HTML RENDERING FUNCTIE ---
        function renderEpisodes(episodes) {
            if (episodes.length === 0) {
                feedDiv.innerHTML = '<div class="no-results">Geen afleveringen gevonden die aan je zoekopdracht voldoen.</div>';
                return;
            }

            let html = '';
            episodes.forEach(ep => {
                html += `
                    <div class="episode">
                        <h2>${ep.title}</h2>
                        <small>${ep.pubDate}</small>
                        <p>${ep.description}</p>
                        ${ep.audioUrl ? `<audio controls src="${ep.audioUrl}" preload="none"></audio>` : ''}
                    </div>
                `;
            });
            feedDiv.innerHTML = html;
        }
    </script>

</body>
</html>
